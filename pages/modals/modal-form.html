<!doctype html>
<html lang="en">
    <!-- @chrome:head title="Form Modals — Admin Panel" favicon="🪟" -->
    <!-- @chrome:sidebar-open variant="light" -->

    <div class="flex h-16 items-center justify-between px-6">
        <a href="/index.html" class="flex items-center gap-2.5">
            <span
                class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white"
                >A</span
            >
            <span class="text-lg font-bold text-gray-900"
                >Acme<span class="text-indigo-600">Admin</span></span
            >
        </a>
        <button
            id="sidebar-close"
            class="text-gray-400 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </button>
    </div>

    <!-- @chrome:sidebar-nav variant="light" user-avatar="https://i.pravatar.cc/80?img=12" user-name="Alex Morgan" user-email="alex@acme.com" user-signedin="alex@acme.com" -->
    <header
        class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-gray-200 bg-white px-4 sm:px-6"
    >
        <button
            id="sidebar-toggle"
            class="text-gray-500 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-900">Form Modals</h1>
        <div class="ml-auto flex items-center gap-3">
            <button
                data-theme-toggle
                aria-label="Toggle theme"
                class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="hidden h-5 w-5 dark:block"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                </svg>
                <svg
                    class="h-5 w-5 dark:hidden"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                    />
                </svg>
            </button>

            <button
                class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>
            </button>
            <img
                class="h-9 w-9 rounded-full object-cover"
                src="https://i.pravatar.cc/80?img=12"
                alt="User"
            />
        </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-4xl">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Form Modals</h1>
                <p class="text-sm text-gray-500">
                    Create, invite and multi-step form dialogs.
                </p>
            </div>

            <!-- Create -->
            <section
                class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">Create Item</h2>
                <div
                    class="relative flex items-center justify-center rounded-lg border border-gray-200 bg-gray-50 p-6"
                >
                    <div
                        class="w-full max-w-md rounded-xl bg-white p-6 shadow-lg ring-1 ring-gray-200"
                    >
                        <div class="flex items-start justify-between">
                            <h3 class="text-lg font-semibold text-gray-900">
                                New project
                            </h3>
                            <button class="text-gray-400 hover:text-gray-600">
                                <svg
                                    class="h-5 w-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"
                                    />
                                </svg>
                            </button>
                        </div>
                        <div class="mt-4 space-y-3">
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Project name</label
                                >
                                <input
                                    type="text"
                                    placeholder="e.g. Marketing site"
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                />
                            </div>
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Description</label
                                >
                                <textarea
                                    rows="3"
                                    placeholder="What is this project about?"
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                ></textarea>
                            </div>
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Visibility</label
                                >
                                <select
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                >
                                    <option>Private</option>
                                    <option>Public</option>
                                    <option>Team</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-end gap-3">
                            <button
                                class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
                            >
                                Cancel
                            </button>
                            <button
                                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
                            >
                                Create project
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Invite -->
            <section
                class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">Invite Members</h2>
                <div
                    class="relative flex items-center justify-center rounded-lg border border-gray-200 bg-gray-50 p-6"
                >
                    <div
                        class="w-full max-w-md rounded-xl bg-white p-6 shadow-lg ring-1 ring-gray-200"
                    >
                        <h3 class="text-lg font-semibold text-gray-900">
                            Invite people
                        </h3>
                        <p class="mt-1 text-sm text-gray-500">
                            Invite teammates to collaborate on this workspace.
                        </p>
                        <div class="mt-4 space-y-3">
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Email address</label
                                >
                                <input
                                    type="email"
                                    placeholder="name@company.com"
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                />
                            </div>
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Role</label
                                >
                                <div class="flex gap-3">
                                    <label
                                        class="flex flex-1 cursor-pointer items-center gap-2 rounded-lg border border-gray-300 px-3 py-2 text-sm"
                                    >
                                        <input
                                            type="radio"
                                            name="role"
                                            checked
                                            class="text-indigo-600"
                                        />
                                        Member
                                    </label>
                                    <label
                                        class="flex flex-1 cursor-pointer items-center gap-2 rounded-lg border border-gray-300 px-3 py-2 text-sm"
                                    >
                                        <input
                                            type="radio"
                                            name="role"
                                            class="text-indigo-600"
                                        />
                                        Admin
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-end gap-3">
                            <button
                                class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
                            >
                                Cancel
                            </button>
                            <button
                                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
                            >
                                Send invite
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Multi-step -->
            <section
                class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">Multi-Step</h2>
                <div
                    class="relative flex items-center justify-center rounded-lg border border-gray-200 bg-gray-50 p-6"
                >
                    <div
                        class="w-full max-w-md rounded-xl bg-white p-6 shadow-lg ring-1 ring-gray-200"
                    >
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-gray-900">
                                Onboarding
                            </h3>
                            <span class="text-sm text-gray-400"
                                >Step 2 of 3</span
                            >
                        </div>
                        <div class="mt-4 flex items-center gap-2">
                            <span
                                class="h-1.5 flex-1 rounded-full bg-indigo-600"
                            ></span>
                            <span
                                class="h-1.5 flex-1 rounded-full bg-indigo-600"
                            ></span>
                            <span
                                class="h-1.5 flex-1 rounded-full bg-gray-200"
                            ></span>
                        </div>
                        <div class="mt-4 space-y-3">
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Company size</label
                                >
                                <select
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                >
                                    <option>1–10</option>
                                    <option>11–50</option>
                                    <option>51–200</option>
                                    <option>200+</option>
                                </select>
                            </div>
                            <div>
                                <label
                                    class="mb-1 block text-sm font-medium text-gray-700"
                                    >Industry</label
                                >
                                <input
                                    type="text"
                                    placeholder="e.g. Technology"
                                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                />
                            </div>
                        </div>
                        <div class="mt-5 flex justify-between">
                            <button
                                class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
                            >
                                Back
                            </button>
                            <button
                                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
                            >
                                Continue
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <!-- @chrome:close -->
</html>
