<!doctype html>
<html lang="en">
    <!-- @chrome:head title="Advanced Form — Admin Panel" favicon="🖥️" -->
    <!-- @chrome:sidebar-open variant="light" -->

    <div class="flex h-16 items-center justify-between px-6">
        <a href="/index.html" class="flex items-center gap-2.5">
            <span
                class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-600 text-sm font-bold text-white"
                >A</span
            >
            <span class="text-lg font-bold text-gray-900"
                >Acme<span class="text-amber-600">Admin</span></span
            >
        </a>
        <button
            id="sidebar-close"
            class="text-gray-400 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </button>
    </div>

    <!-- @chrome:sidebar-nav variant="light" user-avatar="https://i.pravatar.cc/80?img=12" user-name="Alex Morgan" user-email="alex@acme.com" user-signedin="alex@acme.com" -->
    <header
        class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-gray-200 bg-white px-4 sm:px-6"
    >
        <button
            id="sidebar-toggle"
            class="text-gray-500 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-900">Product Settings</h1>
        <div class="ml-auto flex items-center gap-3">
            <button
                data-theme-toggle
                aria-label="Toggle theme"
                class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="hidden h-5 w-5 dark:block"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                </svg>
                <svg
                    class="h-5 w-5 dark:hidden"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                    />
                </svg>
            </button>

            <button
                class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>
            </button>
            <img
                class="h-9 w-9 rounded-full object-cover"
                src="https://i.pravatar.cc/80?img=12"
                alt="User"
            />
        </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-3xl">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">
                    Product Settings
                </h1>
                <p class="text-sm text-gray-500">
                    Configure your product details and preferences.
                </p>
            </div>

            <form
                class="space-y-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <!-- Grid columns -->
                <div class="grid gap-6 sm:grid-cols-2">
                    <div>
                        <label
                            class="mb-1.5 block text-sm font-medium text-gray-700"
                            >Product Name</label
                        >
                        <input
                            type="text"
                            placeholder="Wireless Headphones"
                            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                        />
                    </div>
                    <div>
                        <label
                            class="mb-1.5 block text-sm font-medium text-gray-700"
                            >SKU</label
                        >
                        <input
                            type="text"
                            placeholder="WH-1000"
                            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                        />
                    </div>
                </div>

                <div class="grid gap-6 sm:grid-cols-2">
                    <div>
                        <label
                            class="mb-1.5 block text-sm font-medium text-gray-700"
                            >Price</label
                        >
                        <div class="relative">
                            <span
                                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"
                                >$</span
                            >
                            <input
                                type="number"
                                placeholder="129.00"
                                class="w-full rounded-lg border border-gray-300 py-2.5 pl-7 pr-3.5 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                            />
                        </div>
                    </div>
                    <div>
                        <label
                            class="mb-1.5 block text-sm font-medium text-gray-700"
                            >Category</label
                        >
                        <select
                            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                        >
                            <option>Electronics</option>
                            <option>Audio</option>
                            <option>Accessories</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label
                        class="mb-1.5 block text-sm font-medium text-gray-700"
                        >Description</label
                    >
                    <textarea
                        rows="4"
                        placeholder="Describe your product..."
                        class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                    ></textarea>
                </div>

                <!-- Toggles -->
                <div class="space-y-4 rounded-lg bg-gray-50 p-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-900">
                                Active
                            </p>
                            <p class="text-xs text-gray-500">
                                Make this product visible in the store
                            </p>
                        </div>
                        <button
                            type="button"
                            data-toggle
                            data-on="bg-amber-500"
                            class="relative h-6 w-11 rounded-full bg-amber-500 transition"
                        >
                            <span
                                class="absolute right-1 top-1 h-4 w-4 rounded-full bg-white"
                            ></span>
                        </button>
                    </div>
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-900">
                                Featured
                            </p>
                            <p class="text-xs text-gray-500">
                                Show this product on the homepage
                            </p>
                        </div>
                        <button
                            type="button"
                            data-toggle
                            class="relative h-6 w-11 rounded-full bg-gray-200 transition"
                        >
                            <span
                                class="absolute left-1 top-1 h-4 w-4 rounded-full bg-white"
                            ></span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button
                        type="submit"
                        class="rounded-lg bg-amber-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-amber-700"
                    >
                        Save Changes
                    </button>
                    <button
                        type="button"
                        class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </main>
    <!-- @chrome:close -->
</html>
