<!doctype html>
<html lang="en">
    <!-- @chrome:head title="Login — Centered Card" favicon="🖥️" -->
    <body
        class="flex min-h-screen items-center justify-center bg-gray-50 px-4 font-sans text-gray-900 antialiased"
    >
        <div class="w-full max-w-md">
            <div class="mb-8 text-center">
                <a href="/index.html" class="inline-flex items-center gap-2.5">
                    <span
                        class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white"
                        >A</span
                    >
                    <span class="text-2xl font-bold text-gray-900"
                        >Acme<span class="text-indigo-600">Admin</span></span
                    >
                </a>
            </div>

            <div
                class="rounded-2xl bg-white p-8 shadow-sm ring-1 ring-gray-200"
            >
                <h1 class="text-xl font-bold text-gray-900">Welcome back</h1>
                <p class="mt-1 text-sm text-gray-500">
                    Sign in to your account to continue.
                </p>

                <form class="mt-6 space-y-4">
                    <div>
                        <label
                            class="mb-1.5 block text-sm font-medium text-gray-700"
                            >Email Address</label
                        >
                        <input
                            type="email"
                            placeholder="you@acme.com"
                            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        />
                    </div>
                    <div>
                        <div class="mb-1.5 flex items-center justify-between">
                            <label
                                class="block text-sm font-medium text-gray-700"
                                >Password</label
                            >
                            <a
                                href="#"
                                class="text-sm font-medium text-indigo-600 hover:text-indigo-700"
                                >Forgot password?</a
                            >
                        </div>
                        <input
                            type="password"
                            placeholder="••••••••"
                            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        />
                    </div>
                    <div class="flex items-center justify-between">
                        <label
                            class="flex items-center gap-2 text-sm text-gray-600"
                        >
                            <input
                                type="checkbox"
                                class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                            />
                            Remember me
                        </label>
                    </div>
                    <button
                        type="submit"
                        class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-medium text-white hover:bg-indigo-700"
                    >
                        Sign in
                    </button>
                </form>

                <div class="my-6 flex items-center gap-3">
                    <div class="h-px flex-1 bg-gray-200"></div>
                    <span class="text-xs text-gray-400">or continue with</span>
                    <div class="h-px flex-1 bg-gray-200"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button
                        class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
                    >
                        <svg
                            class="h-4 w-4"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path
                                d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 110-12.064c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0012.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z"
                            />
                        </svg>
                        Google
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
                    >
                        <svg
                            class="h-4 w-4"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                            />
                        </svg>
                        GitHub
                    </button>
                </div>
            </div>

            <p class="mt-6 text-center text-sm text-gray-500">
                Don't have an account?
                <a
                    href="#"
                    class="font-medium text-indigo-600 hover:text-indigo-700"
                    >Sign up</a
                >
            </p>
        </div>
    </body>
</html>
