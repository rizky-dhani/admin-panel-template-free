<!doctype html>
<html lang="en">
    <!-- @chrome:head title="General Settings — Admin Panel" favicon="⚙️" -->
    <!-- @chrome:sidebar-open variant="light" -->

    <div class="flex h-16 items-center justify-between px-6">
        <a href="/index.html" class="flex items-center gap-2.5">
            <span
                class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white"
                >A</span
            >
            <span class="text-lg font-bold text-gray-900"
                >Acme<span class="text-indigo-600">Admin</span></span
            >
        </a>
        <button
            id="sidebar-close"
            class="text-gray-400 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </button>
    </div>

    <!-- @chrome:sidebar-nav variant="light" user-avatar="https://i.pravatar.cc/80?img=12" user-name="Alex Morgan" user-email="alex@acme.com" user-signedin="alex@acme.com" -->
    <header
        class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-gray-200 bg-white px-4 sm:px-6"
    >
        <button
            id="sidebar-toggle"
            class="text-gray-500 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-900">General Settings</h1>
        <div class="ml-auto flex items-center gap-3">
            <button
                data-theme-toggle
                aria-label="Toggle theme"
                class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="hidden h-5 w-5 dark:block"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                </svg>
                <svg
                    class="h-5 w-5 dark:hidden"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                    />
                </svg>
            </button>

            <button
                class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>
            </button>
            <img
                class="h-9 w-9 rounded-full object-cover"
                src="https://i.pravatar.cc/80?img=12"
                alt="User"
            />
        </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-4xl">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">
                    General Settings
                </h1>
                <p class="text-sm text-gray-500">
                    Manage your workspace identity and preferences.
                </p>
            </div>

            <!-- Workspace details -->
            <section
                class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">
                    Workspace Details
                </h2>
                <div class="space-y-4">
                    <div>
                        <label
                            class="mb-1 block text-sm font-medium text-gray-700"
                            >Workspace name</label
                        >
                        <input
                            type="text"
                            value="Acme Inc."
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        />
                    </div>
                    <div>
                        <label
                            class="mb-1 block text-sm font-medium text-gray-700"
                            >Workspace slug</label
                        >
                        <div
                            class="flex items-center rounded-lg border border-gray-300 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-200"
                        >
                            <span
                                class="border-r border-gray-200 px-3 py-2 text-sm text-gray-400"
                                >acme.app/</span
                            >
                            <input
                                type="text"
                                value="acme-inc"
                                class="w-full rounded-r-lg px-3 py-2 text-sm focus:outline-none"
                            />
                        </div>
                    </div>
                    <div>
                        <label
                            class="mb-1 block text-sm font-medium text-gray-700"
                            >Description</label
                        >
                        <textarea
                            rows="3"
                            placeholder="What does your team do?"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        ></textarea>
                    </div>
                </div>
            </section>

            <!-- Preferences -->
            <section
                class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">Preferences</h2>
                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label
                            class="mb-1 block text-sm font-medium text-gray-700"
                            >Timezone</label
                        >
                        <select
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        >
                            <option>UTC (GMT+00:00)</option>
                            <option selected>Pacific Time (GMT-08:00)</option>
                            <option>Eastern Time (GMT-05:00)</option>
                            <option>Central European (GMT+01:00)</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="mb-1 block text-sm font-medium text-gray-700"
                            >Language</label
                        >
                        <select
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                        >
                            <option selected>English (US)</option>
                            <option>English (UK)</option>
                            <option>Español</option>
                            <option>Deutsch</option>
                            <option>Français</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Danger zone -->
            <section
                class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <h2 class="mb-4 font-semibold text-gray-900">Danger Zone</h2>
                <div
                    class="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-rose-200 bg-rose-50 p-4"
                >
                    <div>
                        <p class="text-sm font-semibold text-rose-700">
                            Delete workspace
                        </p>
                        <p class="text-sm text-rose-600">
                            Permanently remove this workspace and all of its
                            data.
                        </p>
                    </div>
                    <button
                        class="rounded-lg border border-rose-300 px-4 py-2 text-sm font-medium text-rose-700 hover:bg-rose-100"
                    >
                        Delete
                    </button>
                </div>
                <div
                    class="mt-6 flex justify-end gap-3 border-t border-gray-200 pt-5"
                >
                    <button
                        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
                    >
                        Cancel
                    </button>
                    <button
                        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
                    >
                        Save changes
                    </button>
                </div>
            </section>
        </div>
    </main>
    <!-- @chrome:close -->
</html>
