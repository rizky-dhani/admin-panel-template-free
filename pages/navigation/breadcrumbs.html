                    <a

                        class="font-medium text-indigo-600 hover:text-indigo-700"

                    <svg
                        class="h-4 w-4 text-gray-300"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >

                            stroke-linejoin="round"
