<!doctype html>
<html lang="en">
    <!-- @chrome:head title="Line Chart — Admin Panel" favicon="🖥️" -->
    <!-- @chrome:sidebar-open variant="light" -->

    <div class="flex h-16 items-center justify-between px-6">
        <a href="/index.html" class="flex items-center gap-2.5">
            <span
                class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white"
                >A</span
            >
            <span class="text-lg font-bold text-gray-900"
                >Acme<span class="text-indigo-600">Admin</span></span
            >
        </a>
        <button
            id="sidebar-close"
            class="text-gray-400 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </button>
    </div>

    <!-- @chrome:sidebar-nav variant="light" user-avatar="https://i.pravatar.cc/80?img=12" user-name="Alex Morgan" user-email="alex@acme.com" user-signedin="alex@acme.com" -->
    <header
        class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-gray-200 bg-white px-4 sm:px-6"
    >
        <button
            id="sidebar-toggle"
            class="text-gray-500 hover:text-gray-900 lg:hidden"
        >
            <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-900">Line Charts</h1>
        <div class="ml-auto flex items-center gap-3">
            <button
                data-theme-toggle
                aria-label="Toggle theme"
                class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="hidden h-5 w-5 dark:block"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                </svg>
                <svg
                    class="h-5 w-5 dark:hidden"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                    />
                </svg>
            </button>

            <button
                class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>
            </button>
            <img
                class="h-9 w-9 rounded-full object-cover"
                src="https://i.pravatar.cc/80?img=12"
                alt="User"
            />
        </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-5xl">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Line Charts</h1>
                <p class="text-sm text-gray-500">
                    Trend visualizations built with pure CSS.
                </p>
            </div>

            <!-- Area chart -->
            <section
                class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <div class="mb-4 flex items-center justify-between">
                    <div>
                        <h2 class="font-semibold text-gray-900">
                            Website Traffic
                        </h2>
                        <p class="text-sm text-gray-500">
                            Unique visitors per week
                        </p>
                    </div>
                    <span
                        class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700"
                        >+12.4%</span
                    >
                </div>
                <div class="relative h-72">
                    <!-- Grid lines -->
                    <div class="absolute inset-0 flex flex-col justify-between">
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                    </div>
                    <!-- Area fill -->
                    <svg
                        class="absolute inset-0 h-full w-full"
                        viewBox="0 0 600 288"
                        preserveAspectRatio="none"
                    >
                        <defs>
                            <linearGradient
                                id="areaFill"
                                x1="0"
                                y1="0"
                                x2="0"
                                y2="1"
                            >
                                <stop
                                    offset="0%"
                                    stop-color="#6366f1"
                                    stop-opacity="0.25"
                                />
                                <stop
                                    offset="100%"
                                    stop-color="#6366f1"
                                    stop-opacity="0"
                                />
                            </linearGradient>
                        </defs>
                        <path
                            d="M0,220 C60,200 80,150 120,160 C160,170 180,110 240,120 C300,130 320,80 360,90 C400,100 440,60 480,70 C520,80 560,40 600,50 L600,288 L0,288 Z"
                            fill="url(#areaFill)"
                        />
                        <path
                            d="M0,220 C60,200 80,150 120,160 C160,170 180,110 240,120 C300,130 320,80 360,90 C400,100 440,60 480,70 C520,80 560,40 600,50"
                            fill="none"
                            stroke="#6366f1"
                            stroke-width="3"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>
            </section>

            <!-- Multi-line -->
            <section
                class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
            >
                <div class="mb-4 flex items-center justify-between">
                    <div>
                        <h2 class="font-semibold text-gray-900">
                            Revenue vs Costs
                        </h2>
                        <p class="text-sm text-gray-500">Monthly trend</p>
                    </div>
                    <div class="flex items-center gap-4 text-xs">
                        <span class="flex items-center gap-1.5 text-gray-500">
                            <span class="h-0.5 w-4 rounded bg-indigo-500"></span
                            >Revenue
                        </span>
                        <span class="flex items-center gap-1.5 text-gray-500">
                            <span class="h-0.5 w-4 rounded bg-rose-400"></span
                            >Costs
                        </span>
                    </div>
                </div>
                <div class="relative h-72">
                    <div class="absolute inset-0 flex flex-col justify-between">
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                        <div
                            class="border-t border-dashed border-gray-200"
                        ></div>
                    </div>
                    <svg
                        class="absolute inset-0 h-full w-full"
                        viewBox="0 0 600 288"
                        preserveAspectRatio="none"
                    >
                        <path
                            d="M0,200 C60,180 80,140 120,150 C160,160 180,100 240,110 C300,120 320,70 360,80 C400,90 440,50 480,60 C520,70 560,30 600,40"
                            fill="none"
                            stroke="#6366f1"
                            stroke-width="3"
                            stroke-linecap="round"
                        />
                        <path
                            d="M0,230 C60,220 80,200 120,205 C160,210 180,180 240,185 C300,190 320,160 360,165 C400,170 440,140 480,145 C520,150 560,120 600,125"
                            fill="none"
                            stroke="#fb7185"
                            stroke-width="3"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>
            </section>
        </div>
    </main>
    <!-- @chrome:close -->
</html>
